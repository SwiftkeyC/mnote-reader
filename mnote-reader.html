<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mnote Reader</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='3' width='24' height='26' rx='4' fill='%236d3fc0'/%3E%3Cpath d='M10 10h12M10 15h12M10 20h8' stroke='white' stroke-width='2.4' stroke-linecap='round'/%3E%3C/svg%3E">
<style>
:root {
  color-scheme: light;
  --ui: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --sans: "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, sans-serif;
  --serif: "Sitka Text", Charter, Cambria, Georgia, serif;
  --read-font: var(--sans);
  --zoom: 1;
  --read-size: 17px;
  --leading: 1.65;
  --sheet-w: 760px;

  --canvas: #e9e8ee;
  --chrome: #fbfbfc;
  --chrome-2: #f1f0f5;
  --hover: rgba(40, 25, 80, .06);
  --line: #e3e1ea;
  --line-2: #cfccd9;
  --text: #1f1d26;
  --text-2: #5f5b6b;
  --text-3: #8b8798;
  --paper: #ffffff;
  --paper-text: #22202a;
  --paper-2: #6c6878;
  --paper-line: #ebe9f1;
  --paper-tint: #f6f5f9;
  --accent: #6d3fc0;
  --accent-soft: #efe9fb;
  --accent-text: #5a2fa6;
  --focus: #8b5cf6;
  --shadow-sheet: 0 1px 2px rgba(25, 20, 45, .06), 0 10px 28px rgba(25, 20, 45, .08);
  --shadow-pop: 0 4px 12px rgba(25, 20, 45, .12), 0 18px 44px rgba(25, 20, 45, .16);
  --hl-yellow: #fde68a; --hl-green: #bbf7d0; --hl-blue: #bfdbfe; --hl-pink: #fbcfe8;
  --sw-yellow: #facc15; --sw-green: #4ade80; --sw-blue: #60a5fa; --sw-pink: #f472b6;
  --ok: #16a34a; --warn: #d97706; --bad: #dc2626;
}
:root[data-theme="sepia"] {
  --canvas: #e6decf; --chrome: #f9f4ea; --chrome-2: #f0e8d9; --hover: rgba(90, 60, 15, .07);
  --line: #e4d9c5; --line-2: #d3c5ab; --text: #3a2f22; --text-2: #6d5e49; --text-3: #988870;
  --paper: #fbf6ec; --paper-text: #3a2f22; --paper-2: #7b6b55; --paper-line: #ebe0cc; --paper-tint: #f4ecdd;
  --accent: #8a5a2b; --accent-soft: #f0e2cb; --accent-text: #74491f; --focus: #b07a3f;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --canvas: #121117; --chrome: #1b1a21; --chrome-2: #24232c; --hover: rgba(255, 255, 255, .06);
  --line: #2d2b36; --line-2: #3d3a48; --text: #ebe9f1; --text-2: #aba7b8; --text-3: #7d798b;
  --paper: #1e1d25; --paper-text: #e7e4ee; --paper-2: #a29eb1; --paper-line: #302e3a; --paper-tint: #262530;
  --accent: #a78bfa; --accent-soft: #2f2648; --accent-text: #c9b8fe; --focus: #a78bfa;
  --shadow-sheet: 0 1px 2px rgba(0, 0, 0, .4), 0 10px 28px rgba(0, 0, 0, .35);
  --shadow-pop: 0 4px 12px rgba(0, 0, 0, .4), 0 18px 44px rgba(0, 0, 0, .45);
  --hl-yellow: rgba(250, 204, 21, .32); --hl-green: rgba(74, 222, 128, .26); --hl-blue: rgba(96, 165, 250, .3); --hl-pink: rgba(244, 114, 182, .3);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--canvas); color: var(--text);
  font: 13.5px/1.45 var(--ui);
  display: grid; grid-template-rows: 48px minmax(0, 1fr); overflow: hidden;
}
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; flex: none; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* ---------- toolbar ---------- */
.toolbar {
  position: relative; z-index: 10;
  display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 8px;
  padding: 0 8px; background: var(--chrome); border-bottom: 1px solid var(--line);
}
.tb-left, .tb-center, .tb-right { display: flex; align-items: center; gap: 2px; min-width: 0; }
.tb-right { justify-content: flex-end; }
.tb-sep { width: 1px; height: 20px; background: var(--line); margin: 0 6px; flex: none; }
.icon-btn {
  position: relative; display: inline-grid; place-items: center; flex: none;
  width: 32px; height: 32px; border: 0; border-radius: 7px; background: transparent; color: var(--text-2); cursor: pointer;
}
.icon-btn:hover { background: var(--hover); color: var(--text); }
.icon-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.icon-btn:disabled { opacity: .35; cursor: default; background: transparent; }
.icon-btn.slim { width: 18px; margin-left: -2px; }
.icon-btn.slim svg { width: 12px; height: 12px; }
.hl-btn .hl-bar { position: absolute; left: 8px; right: 8px; bottom: 5px; height: 3px; border-radius: 2px; background: var(--sw); }
.doc-title { display: flex; flex-direction: column; min-width: 0; margin-left: 6px; line-height: 1.25; }
.doc-title b { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.doc-title span { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.page-box { display: flex; align-items: center; gap: 6px; color: var(--text-2); font-variant-numeric: tabular-nums; margin: 0 2px; }
.page-box input {
  width: 46px; height: 28px; text-align: center; font: inherit; color: var(--text);
  border: 1px solid var(--line-2); border-radius: 7px; background: var(--paper);
}
.zoom-label {
  min-width: 52px; height: 28px; border: 0; border-radius: 7px; background: transparent;
  color: var(--text-2); font-variant-numeric: tabular-nums; cursor: pointer;
}
.zoom-label:hover { background: var(--hover); color: var(--text); }
.save-state { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-3); margin-right: 6px; white-space: nowrap; }
.save-state::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--ok); }
.save-state[data-state="saving"]::before { background: var(--warn); }
.save-state[data-state="error"]::before { background: var(--bad); }
.save-state[data-state="error"] { color: var(--bad); }
.badge {
  position: absolute; top: 2px; right: 1px; min-width: 16px; height: 16px; padding: 0 4px;
  border-radius: 8px; background: var(--accent); color: #fff; font-size: 10px; line-height: 16px; font-weight: 700;
}
:root[data-theme="dark"] .badge { color: #1b1a21; }
.badge:empty { display: none; }
.progress { position: absolute; left: 0; bottom: -1px; height: 2px; width: 0; background: var(--accent); transition: width .12s linear; }

/* ---------- layout ---------- */
.workspace {
  display: grid; min-height: 0;
  grid-template-columns: var(--sb, 300px) minmax(0, 1fr) var(--np, 0px);
  transition: grid-template-columns .18s ease;
}
body:not(.sb-open) .workspace { --sb: 0px; }
body.np-open .workspace { --np: 344px; }
.sidebar { grid-column: 1; grid-row: 1; }
.viewer { grid-column: 2; grid-row: 1; }
.notes { grid-column: 3; grid-row: 1; }

/* ---------- sidebar ---------- */
.sidebar { min-width: 0; overflow: hidden; background: var(--chrome); border-right: 1px solid var(--line); display: flex; flex-direction: column; }
body:not(.sb-open) .sidebar { border-right: 0; }
.sb-tabs { display: flex; gap: 4px; padding: 6px 10px 0; border-bottom: 1px solid var(--line); min-width: 300px; }
.sb-tab {
  flex: 1; display: flex; align-items: center; justify-content: center; gap: 6px;
  border: 0; background: transparent; padding: 9px 4px 10px; color: var(--text-2); font-weight: 500; cursor: pointer;
  border-bottom: 2px solid transparent; margin-bottom: -1px;
}
.sb-tab svg.i { width: 16px; height: 16px; }
.sb-tab:hover { color: var(--text); }
.sb-tab[aria-selected="true"] { color: var(--accent-text); border-bottom-color: var(--accent); }
.sb-pane { flex: 1; overflow: auto; padding: 8px 8px 32px; min-width: 300px; }
.sb-pane[hidden] { display: none; }

.row {
  display: flex; align-items: center; gap: 8px; width: 100%; min-width: 0;
  border: 0; background: transparent; border-radius: 7px; text-align: left; cursor: pointer; color: var(--text);
}
.row:hover { background: var(--hover); }
.row .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .n { font-size: 11.5px; color: var(--text-3); font-variant-numeric: tabular-nums; flex: none; }
.chev { width: 14px; height: 14px; color: var(--text-3); transition: transform .15s; }
.open > .row > .chev { transform: rotate(90deg); }
.nb-row { padding: 8px 8px; font-weight: 600; }
.nb-row svg.book { color: var(--accent); }
.sec-row { padding: 6px 8px 6px 18px; font-weight: 500; }
.sec-dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); flex: none; }
.pg-row { padding: 5px 8px 5px 49px; color: var(--text-2); }
.pg-row[aria-current="true"] { background: var(--accent-soft); color: var(--accent-text); font-weight: 500; }
.pg-row .flags { display: flex; gap: 3px; color: var(--accent); flex: none; }
.pg-row .flags svg.i { width: 13px; height: 13px; }
.pg-row.empty .t { color: var(--text-3); }
.kids { display: none; }
.open > .kids { display: block; }

.pane-empty { padding: 36px 18px; text-align: center; color: var(--text-3); }
.pane-empty svg.i { width: 28px; height: 28px; margin-bottom: 8px; color: var(--line-2); }
.pane-empty b { display: block; color: var(--text-2); margin-bottom: 4px; font-weight: 600; }

.search-box { position: sticky; top: -8px; margin: -8px -8px 6px; padding: 10px 10px 8px; background: var(--chrome); z-index: 1; }
.search-field { position: relative; }
.search-field svg.i { position: absolute; left: 10px; top: 9px; width: 16px; height: 16px; color: var(--text-3); }
.search-field input {
  width: 100%; height: 34px; padding: 0 10px 0 34px; font: inherit; color: var(--text);
  background: var(--paper); border: 1px solid var(--line-2); border-radius: 9px;
}
.search-field input:focus { outline: none; border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
.search-meta { font-size: 12px; color: var(--text-3); padding: 6px 4px 0; }
.sr-group { font-size: 11.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--text-3); padding: 12px 8px 4px; }
.sr { display: block; padding: 8px 10px; }
.sr .t { display: block; font-weight: 600; }
.sr .where { display: block; font-size: 11.5px; color: var(--text-3); margin-top: 1px; }
.sr .snip { display: block; font-size: 12.5px; color: var(--text-2); margin-top: 3px; line-height: 1.45; white-space: normal; }
.sr mark { background: var(--hl-yellow); color: inherit; border-radius: 2px; padding: 0 1px; }
.bm { display: block; padding: 8px 10px; }
.bm .t { display: block; font-weight: 600; }
.bm .where { display: block; font-size: 11.5px; color: var(--text-3); }

/* ---------- viewer & sheets ---------- */
.viewer { position: relative; overflow: auto; outline: none; overflow-anchor: none; }
.doc { position: relative; padding: 24px 24px 160px; }
.chapter {
  width: calc(var(--sheet-w) * var(--zoom)); max-width: 100%; margin: 26px auto 12px;
  display: flex; align-items: center; gap: 10px;
  color: var(--text-2); font-size: 11.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase;
}
.chapter:first-child { margin-top: 4px; }
.chapter i { width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
.chapter::after { content: ""; flex: 1; height: 1px; background: var(--line-2); }
.sheet {
  position: relative; width: calc(var(--sheet-w) * var(--zoom)); max-width: 100%;
  margin: 0 auto 22px; min-height: calc(300px * var(--zoom));
  padding: calc(50px * var(--zoom)) calc(64px * var(--zoom)) calc(56px * var(--zoom));
  background: var(--paper); color: var(--paper-text); box-shadow: var(--shadow-sheet); border-radius: 4px;
  font-family: var(--read-font); font-size: calc(var(--read-size) * var(--zoom)); line-height: var(--leading);
}
.sheet.bookmarked::before {
  content: ""; position: absolute; top: 0; right: calc(30px * var(--zoom));
  width: calc(14px * var(--zoom)); height: calc(24px * var(--zoom)); background: var(--accent);
  clip-path: polygon(0 0, 100% 0, 100% 100%, 50% 74%, 0 100%);
}
.sheet-head { margin-bottom: 1.3em; padding-bottom: .9em; border-bottom: 1px solid var(--paper-line); }
.kicker {
  display: flex; align-items: center; gap: 8px; color: var(--paper-2);
  font: 700 calc(11px * var(--zoom))/1.3 var(--ui); letter-spacing: .07em; text-transform: uppercase;
}
.kicker i { width: calc(8px * var(--zoom)); height: calc(8px * var(--zoom)); border-radius: 2px; background: var(--c); }
.kicker .of { font-weight: 500; letter-spacing: .03em; text-transform: none; }
.sheet h1 { font-size: 1.72em; line-height: 1.2; margin: .35em 0 .25em; font-weight: 650; letter-spacing: -.012em; overflow-wrap: anywhere; padding-right: 2.6em; }
.meta { font: calc(12.5px * var(--zoom))/1.4 var(--ui); color: var(--paper-2); }
.sheet-actions { position: absolute; top: calc(38px * var(--zoom)); right: calc(22px * var(--zoom)); display: flex; flex-direction: column; gap: 2px; }
.sheet-actions .icon-btn { opacity: .45; }
.sheet:hover .sheet-actions .icon-btn, .sheet-actions .icon-btn:focus-visible, .sheet-actions .icon-btn[aria-pressed="true"] { opacity: 1; }
.sheet-foot { position: absolute; left: 0; right: 0; bottom: calc(18px * var(--zoom)); text-align: center; font: calc(11.5px * var(--zoom))/1 var(--ui); color: var(--paper-2); font-variant-numeric: tabular-nums; }
.skeleton { display: grid; gap: .7em; padding-top: .3em; }
.skeleton span { height: .8em; border-radius: 4px; background: var(--paper-tint); }
.skeleton span:nth-child(2) { width: 82%; } .skeleton span:nth-child(3) { width: 64%; }
.sheet-empty { color: var(--paper-2); font-style: italic; margin: .2em 0 0; }

/* page content from the .mnote */
/* break-word, not anywhere: "anywhere" lets table columns shrink to a few letters wide. */
.page-body { overflow-wrap: break-word; }
.page-body td { hyphens: auto; }
.page-body .outline + .outline { margin-top: 1.1em; }
.page-body .line { min-height: 1em; margin: .22em 0; }
.page-body .kids { display: block; margin-left: 1.45em; }
.page-body .marker { display: inline-block; min-width: 1.35em; color: var(--paper-2); }
.page-body .check { margin-right: .35em; }
.page-body .tag { font: 700 .66em/1 var(--ui); background: var(--accent-soft); color: var(--accent-text); border-radius: 4px; padding: .3em .5em; margin-right: .45em; vertical-align: .18em; }
.page-body .muted { color: var(--paper-2); font-style: italic; }
.page-body a { color: var(--accent-text); text-underline-offset: 2px; }
.page-body table { border-collapse: collapse; margin: .9em 0; font-size: .86em; line-height: 1.5; width: 100%; }
.page-body td { padding: .55em .75em; vertical-align: top; border: 1px solid var(--paper-line); }
.page-body tr:first-child td { background: var(--paper-tint); }
.page-body td .line { margin: 0; }
.page-body ul, .page-body ol { margin: .35em 0; padding-left: 1.5em; }
.page-body li { margin: .15em 0; }
.page-body p { margin: .35em 0; }
.page-body h2 { font-size: 1.3em; line-height: 1.3; margin: .9em 0 .35em; font-weight: 650; }
.page-body h3 { font-size: 1.12em; margin: .8em 0 .3em; font-weight: 650; }

/* edit mode */
.sheet.editing { box-shadow: 0 0 0 2px var(--accent), var(--shadow-sheet); }
.sheet.editing .sheet-actions { display: none; }
.sheet.editing h1, .sheet.editing .page-body { outline: none; border-radius: 5px; caret-color: var(--accent); }
.sheet.editing h1:focus, .sheet.editing .page-body:focus { background: var(--paper-tint); }
.sheet.editing .page-body { min-height: 8em; padding: .3em .45em; margin: 0 -.45em; }
.sheet.editing .page-body:empty::before { content: "Start typing…"; color: var(--paper-2); }
.sheet.editing .page-body .check { cursor: pointer; }
.sheet.editing .page-body img { cursor: default; }
.edit-bar {
  position: sticky; top: 10px; z-index: 6; display: flex; flex-wrap: wrap; align-items: center; gap: 2px;
  margin: 0 calc(-28px * var(--zoom)) 1.2em; padding: 5px 6px; font: 13px/1.2 var(--ui); color: var(--text);
  background: var(--chrome); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow-pop);
}
.edit-bar .vsep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; }
.fmt-btn {
  display: inline-grid; place-items: center; min-width: 30px; height: 30px; padding: 0 6px;
  border: 0; border-radius: 7px; background: transparent; color: var(--text-2); cursor: pointer; font: 600 14px/1 var(--ui);
}
.fmt-btn svg.i { width: 17px; height: 17px; }
.fmt-btn:hover { background: var(--hover); color: var(--text); }
.fmt-btn[aria-pressed="true"] { background: var(--accent-soft); color: var(--accent-text); }
.fmt-btn.l-bold, .fmt-btn.l-heading { font-weight: 800; }
.fmt-btn.l-italic { font-style: italic; font-family: Georgia, serif; }
.fmt-btn.l-underline { text-decoration: underline; }
.fmt-btn.l-strikeThrough { text-decoration: line-through; }
.edit-status { margin-left: auto; padding: 0 8px; font-size: 12px; color: var(--text-3); white-space: nowrap; }
.txt-btn.primary { background: var(--accent); color: var(--chrome); font-weight: 600; }
.txt-btn.primary:hover { background: var(--accent); filter: brightness(1.08); }
.page-body img { display: block; max-width: 100%; height: auto; margin: .5em 0 .7em; border-radius: 5px; box-shadow: 0 0 0 1px var(--paper-line); cursor: zoom-in; }
.page-body .file { display: inline-flex; gap: .4em; border: 1px solid var(--paper-line); border-radius: 6px; padding: .15em .6em; text-decoration: none; }

mark.hl { color: inherit; background: var(--hl-yellow); border-radius: 2px; padding: .05em 0; cursor: pointer; -webkit-box-decoration-break: clone; box-decoration-break: clone; }
mark.hl[data-c="green"] { background: var(--hl-green); }
mark.hl[data-c="blue"] { background: var(--hl-blue); }
mark.hl[data-c="pink"] { background: var(--hl-pink); }
mark.hl.end.has-note::after {
  content: ""; display: inline-block; width: .5em; height: .5em; margin-left: .15em; border-radius: 50%;
  background: var(--accent); vertical-align: .55em;
}
mark.hl.flash { animation: flash 1.4s ease; }
@keyframes flash { 0%, 40% { box-shadow: 0 0 0 3px var(--accent); } 100% { box-shadow: 0 0 0 3px transparent; } }
::highlight(search) { background-color: #fb923c; color: #111; }
.sheet ::selection { background: rgba(124, 92, 214, .28); }

/* ---------- notes panel ---------- */
.notes { min-width: 0; overflow: hidden; background: var(--chrome); border-left: 1px solid var(--line); display: flex; flex-direction: column; }
body:not(.np-open) .notes { border-left: 0; }
.np-head { display: flex; align-items: center; gap: 6px; padding: 8px 8px 8px 16px; border-bottom: 1px solid var(--line); min-width: 344px; height: 49px; }
.np-head h2 { margin: 0; font-size: 14px; font-weight: 600; }
.seg { display: inline-flex; margin-left: auto; padding: 2px; background: var(--chrome-2); border-radius: 8px; }
.seg button { border: 0; background: transparent; padding: 4px 10px; border-radius: 6px; font-size: 12.5px; color: var(--text-2); cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--chrome); color: var(--text); box-shadow: 0 1px 2px rgba(0, 0, 0, .1); }
.np-list { flex: 1; overflow: auto; padding: 14px 12px 40px; min-width: 344px; }
.ng { margin-bottom: 18px; }
.ng-title { padding: 2px 4px 8px; font-weight: 600; }
.ng-title .n { margin-left: auto; }
.card { position: relative; background: var(--paper); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; margin-bottom: 8px; }
.card.active { border-color: var(--focus); box-shadow: 0 0 0 3px var(--accent-soft); }
.card-quote {
  display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
  border-left: 3px solid var(--c); padding-left: 10px; cursor: pointer;
  font-family: var(--read-font); font-size: 13.5px; line-height: 1.5; color: var(--text);
}
.card-label { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--accent-text); }
.card textarea {
  display: block; width: 100%; margin-top: 8px; min-height: 34px; padding: 7px 9px; resize: none;
  font: 13px/1.45 var(--ui); color: var(--text); background: var(--chrome-2);
  border: 1px solid transparent; border-radius: 7px; field-sizing: content; max-height: 260px;
}
.card textarea:focus { outline: none; background: var(--paper); border-color: var(--focus); }
.card-foot { display: flex; align-items: center; justify-content: space-between; margin-top: 6px; font-size: 11.5px; color: var(--text-3); }
.card-foot .icon-btn { width: 26px; height: 26px; }
.card-foot svg.i { width: 15px; height: 15px; }
.np-empty { padding: 42px 22px; text-align: center; color: var(--text-3); }
.np-empty svg.i { width: 30px; height: 30px; color: var(--line-2); margin-bottom: 10px; }
.np-empty b { display: block; color: var(--text-2); font-weight: 600; margin-bottom: 4px; }

/* ---------- popovers, menus ---------- */
.pop {
  position: fixed; z-index: 50; display: flex; align-items: center; gap: 4px; padding: 5px;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 11px; box-shadow: var(--shadow-pop);
}
.pop[hidden], .menu[hidden] { display: none; }
.swatch { width: 24px; height: 24px; border-radius: 50%; border: 0; background: var(--sw); cursor: pointer; box-shadow: inset 0 0 0 1px rgba(0, 0, 0, .12); }
.swatch[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--chrome), 0 0 0 4px var(--text-2); }
.pop .vsep { width: 1px; height: 20px; background: var(--line); margin: 0 3px; }
.txt-btn { display: inline-flex; align-items: center; gap: 6px; height: 30px; padding: 0 10px; border: 0; border-radius: 7px; background: transparent; cursor: pointer; color: var(--text); white-space: nowrap; }
.txt-btn:hover { background: var(--hover); }
.txt-btn svg.i { width: 16px; height: 16px; color: var(--text-2); }
.txt-btn.danger, .txt-btn.danger svg.i { color: var(--bad); }

.menu {
  position: fixed; z-index: 40; width: 300px; padding: 16px;
  background: var(--chrome); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow-pop);
}
.menu h3 { margin: 0 0 8px; font-size: 11px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase; color: var(--text-3); }
.themes { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-bottom: 18px; }
.theme-chip {
  height: 48px; border-radius: 9px; border: 1px solid var(--line-2); cursor: pointer;
  display: grid; place-items: center; font-weight: 600; font-size: 12px;
}
.theme-chip[data-v="light"] { background: #fff; color: #22202a; }
.theme-chip[data-v="sepia"] { background: #fbf6ec; color: #3a2f22; }
.theme-chip[data-v="dark"] { background: #1e1d25; color: #e7e4ee; }
.theme-chip[data-v="auto"] { background: linear-gradient(135deg, #fff 50%, #1e1d25 50%); color: #6d3fc0; }
.theme-chip[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.opt { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.opt > span { color: var(--text-2); }
.opt .seg { margin-left: 0; }
.stepper { display: inline-flex; align-items: center; gap: 2px; background: var(--chrome-2); border-radius: 8px; padding: 2px; }
.stepper button { width: 28px; height: 26px; border: 0; border-radius: 6px; background: transparent; cursor: pointer; font-weight: 600; color: var(--text-2); }
.stepper button:hover { background: var(--chrome); color: var(--text); }
.stepper output { min-width: 40px; text-align: center; font-variant-numeric: tabular-nums; }
.menu-foot { border-top: 1px solid var(--line); margin: 4px -16px -16px; padding: 10px 16px; font-size: 12px; color: var(--text-3); }

.lightbox { position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; padding: 36px; background: rgba(12, 10, 18, .84); cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 20px 60px rgba(0, 0, 0, .5); background: #fff; }
.lightbox[hidden] { display: none; }

.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: 120; transform: translate(-50%, 12px); opacity: 0; pointer-events: none;
  background: #26232f; color: #f4f2f8; padding: 9px 14px; border-radius: 9px; box-shadow: var(--shadow-pop); transition: .18s ease;
}
.toast.show { opacity: 1; transform: translate(-50%, 0); }

.state { max-width: 440px; margin: 12vh auto; text-align: center; color: var(--text-2); padding: 0 16px; }
.state svg.i { width: 40px; height: 40px; color: var(--accent); margin-bottom: 12px; }
.state h2 { color: var(--text); font-size: 18px; margin: 0 0 6px; }
.state code { background: var(--chrome-2); padding: 2px 6px; border-radius: 5px; font-size: 12.5px; }

@media (max-width: 1100px) {
  body.np-open .workspace { --np: 0px; }
  body.np-open .notes { position: fixed; right: 0; top: 49px; bottom: 0; width: 344px; z-index: 30; box-shadow: var(--shadow-pop); }
}
@media (max-width: 820px) {
  .workspace { --sb: 0px !important; }
  body.sb-open .sidebar { position: fixed; left: 0; top: 49px; bottom: 0; width: 300px; z-index: 30; box-shadow: var(--shadow-pop); }
  .doc-title, .zoom-group, .save-state { display: none; }
  .doc { padding: 12px 8px 120px; }
}

@media print {
  :root, :root[data-theme] { --paper: #fff; --paper-text: #111; --paper-2: #555; --paper-line: #ddd; --paper-tint: #f3f3f3; --zoom: 1; }
  html, body { height: auto; overflow: visible; background: #fff; display: block; }
  .toolbar, .sidebar, .notes, .pop, .menu, .toast, .lightbox, .sheet-actions, .chapter, .sheet-foot, .edit-bar { display: none !important; }
  .workspace, .viewer { display: block; overflow: visible; }
  .doc { padding: 0; }
  .sheet { width: auto; max-width: none; margin: 0; padding: 0; min-height: 0; box-shadow: none; border-radius: 0; font-size: 11.5pt; break-after: page; }
  .sheet.bookmarked::before { display: none; }
  mark.hl, .page-body tr:first-child td { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
}
</style>

<script>
'use strict';
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
// mnote.ps1 replaces the placeholder below with this run's token when it serves the page.
const SERVED_TOKEN = '__MNOTE_TOKEN__';
const TOKEN = new URLSearchParams(location.search).get('t') || (/^[0-9a-f]{32}$/.test(SERVED_TOKEN) ? SERVED_TOKEN : '');
const COLORS = ['yellow', 'green', 'blue', 'pink'];
const SECTION_COLORS = ['#7c5cd6', '#d9534f', '#2f9e6e', '#e0912f', '#3b82c4', '#c2509a', '#5f8f2f', '#b5762d', '#4a6fd1', '#a3506b', '#2b8c99', '#8a6d3b'];
const ZOOMS = [0.6, 0.7, 0.8, 0.9, 1, 1.1, 1.25, 1.5, 1.75, 2];
const narrow = () => matchMedia('(max-width: 820px)').matches;

const store = {
  get(k, d) { try { const v = localStorage.getItem('mnote:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('mnote:' + k, JSON.stringify(v)); } catch { /* storage unavailable */ } },
};

const state = {
  lib: null, pages: [], byPath: new Map(), doc: null, current: 0,
  ann: new Map(), html: new Map(), text: new Map(), timers: new Map(),
  openKeys: new Set(), notesScope: 'page', pageNoteOpen: null,
  hlMode: false, hlColor: store.get('hlColor', 'yellow'), sel: null, activeHl: null, search: '',
  settings: Object.assign({ theme: 'auto', font: 'sans', size: 17, leading: 1.65, width: 760, zoom: 1 }, store.get('settings', {})),
};

// ---------------------------------------------------------------- helpers
function el(tag, attrs = {}, ...kids) {
  const n = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs)) {
    if (v == null || v === false) continue;
    if (k === 'class') n.className = v; else if (k === 'text') n.textContent = v;
    else if (k === 'style') n.style.cssText = v; else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else n.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()) if (c != null) n.append(c);
  return n;
}
const icon = (id, cls = '') => { const s = document.createElementNS('http://www.w3.org/2000/svg', 'svg'); s.setAttribute('class', 'i ' + cls); const u = document.createElementNS('http://www.w3.org/2000/svg', 'use'); u.setAttribute('href', '#' + id); s.append(u); return s; };
const fmtDate = iso => { if (!iso) return ''; const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleString(undefined, { day: 'numeric', month: 'short', year: 'numeric', hour: '2-digit', minute: '2-digit' }); };
const fmtShort = iso => { const d = new Date(iso); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { day: 'numeric', month: 'short' }); };
const now = () => new Date().toISOString();
const uid = () => 'h' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
function toast(msg) { const t = $('#toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove('show'), 2200); }

async function api(url, opts = {}) {
  const res = await fetch(url, Object.assign({}, opts, { headers: Object.assign({ 'X-Mnote-Token': TOKEN }, opts.headers || {}) }));
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text().catch(() => '')));
  return res;
}
const entryUrl = (path, name) => `/api/entry?path=${encodeURIComponent(path)}&name=${encodeURIComponent(name)}&t=${TOKEN}`;

// ---------------------------------------------------------------- settings
function applySettings() {
  const s = state.settings, root = document.documentElement;
  const dark = matchMedia('(prefers-color-scheme: dark)').matches;
  root.dataset.theme = s.theme === 'auto' ? (dark ? 'dark' : 'light') : s.theme;
  root.style.setProperty('--read-font', s.font === 'serif' ? 'var(--serif)' : 'var(--sans)');
  root.style.setProperty('--read-size', s.size + 'px');
  root.style.setProperty('--leading', s.leading);
  root.style.setProperty('--sheet-w', s.width + 'px');
  root.style.setProperty('--zoom', s.zoom);
  $('#btnZoomReset').textContent = Math.round(s.zoom * 100) + '%';
  $('#sizeOut').textContent = s.size;
  $$('.theme-chip').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === s.theme));
  $$('#optFont button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === s.font));
  $$('#optLeading button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === +s.leading));
  $$('#optWidth button').forEach(b => b.setAttribute('aria-pressed', +b.dataset.v === +s.width));
  $('#btnHighlighter').style.setProperty('--sw', `var(--sw-${state.hlColor})`);
  store.set('settings', s);
}
function setSetting(k, v) {
  const anchor = keepPlace();
  state.settings[k] = v; applySettings(); anchor();
}
// Keeps the reading position when page sizes change (zoom, text size, width).
function keepPlace() {
  const e = curEntry(); if (!e || !e.sheet) return () => {};
  const v = $('#viewer'), frac = (v.scrollTop - e.sheet.offsetTop) / Math.max(1, e.sheet.offsetHeight);
  return () => { anchor = { e, delta: frac * e.sheet.offsetHeight }; applyAnchor(); };
}
function zoomStep(dir) {
  const z = state.settings.zoom;
  let i = ZOOMS.findIndex(x => x >= z - 0.001);

    else if (ev.key.toLowerCase() === 'h') $('#btnHighlighter').click();
    else if (ev.key.toLowerCase() === 'n') toggleNotes();
    else if (ev.key.toLowerCase() === 'b' && curEntry()) toggleBookmark(curEntry());
    else if (ev.key.toLowerCase() === 'e' && curEntry()) { ev.preventDefault(); startEdit(curEntry()); }
  });
  document.addEventListener('selectionchange', () => { if (state.edit) updateEditBar(); });
  addEventListener('beforeunload', ev => {
    flushSaves();
    if (state.edit?.dirty) { ev.preventDefault(); ev.returnValue = ''; }
  });
  document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') flushSaves(); else ping(); });
}
function ping() { api('/api/ping').catch(() => setSave('error')); }

function showState(kind, detail) {
  const doc = $('#doc'); doc.textContent = '';
  $('#docSub').textContent = '';
  const box = el('div', { class: 'state' }, icon('i-book'));
  if (kind === 'token') box.append(el('h2', { text: 'Open the reader from mnote.ps1' }), el('p', {}, 'Start it with ', el('code', { text: '.\\mnote.ps1 read' }), ' or by double-clicking a .mnote file.'));
  else if (kind === 'empty') box.append(el('h2', { text: 'No .mnote files here' }), el('p', { text: 'Export your OneNote notebooks first, then open the export folder.' }));
  else box.append(el('h2', { text: 'The reader lost its connection' }), el('p', { text: 'The local reader service is not answering. Close this window and open the .mnote file again. (' + (detail || '') + ')' }));
  doc.append(box);
}

async function init() {
  applySettings();
  bindUI();
  toggleSidebar(narrow() ? false : store.get('sidebar', true));
  if (!TOKEN) { showState('token'); return; }
  let lib;
  try { lib = await (await api('/api/library')).json(); } catch (err) { showState('error', err.message); return; }
  setupLibrary(lib);
  renderBookmarks();
  if (!state.pages.length) { renderTree(); showState('empty'); return; }
  const wanted = new URLSearchParams(location.hash.slice(1)).get('open') || store.get('lastPage', null);
  const start = state.byPath.get(wanted) || state.pages[0];
  if (store.get('notes', false)) toggleNotes(true);
  openPage(start);
  setInterval(ping, 20000);
}
init();
</script>
</body>
</html>
