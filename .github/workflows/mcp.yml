# Tests the MCP server, the flashcard and the Alexa-like demo from a fresh checkout on Linux,
# macOS and Windows: npm ci, npm test, and npm run demo:check (starts `npm run demo` and uses it).
name: MCP server

on:
  push:
    branches: [main]
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  pull_request:
    paths: ['mcp/**', '.github/workflows/mcp.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }}, Node ${{ matrix.node }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22]
        include:
          - os: ubuntu-latest
            node: 20
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run demo:check
